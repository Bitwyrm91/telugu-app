<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Telugu</title>
<link rel="preload" href="fonts/NotoSansTelugu.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/NotoSans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg class="icon-defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- 24 px grid, 2 px round strokes, currentColor (DESIGN 6) -->
    <symbol id="i-learn" viewBox="0 0 24 24">
      <path d="M6 20c0-3 3-4 6-4s6-1 6-4-3-4-6-4-6-1-6-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="6" cy="20" r="1.6" fill="currentColor"/>
      <circle cx="18" cy="12" r="1.6" fill="currentColor"/>
      <circle cx="6" cy="4" r="1.6" fill="currentColor"/>
    </symbol>
    <!-- the letter "a" (U+0C05) drawn as an outlined path inside a rounded square -->
    <symbol id="i-letters" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M8.5 10.2a2.2 2.2 0 1 1 2.6 2.1H10a2.3 2.3 0 1 0 2.3 2.4c0-1 .9-1.6 1.8-1.6h1.4M15.5 13.1V8.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="6.6" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>
  </defs>
</svg>

<div class="shell" id="shell" data-layout="nav">
  <nav class="nav" id="nav" aria-label="Main">
    <a class="wordmark" href="#/" aria-label="Telugu, home">
      <svg class="wordmark-tile" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect class="tile-bg" x="0" y="0" width="24" height="24" rx="6"/>
        <path class="tile-glyph" d="M7.2 9.8a2.6 2.6 0 1 1 3.1 2.5H9a2.7 2.7 0 1 0 2.7 2.8c0-1.1 1-1.9 2.1-1.9h1.7M16.8 13.2V7.4" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="wordmark-name">Telugu</span>
    </a>
    <a class="nav-item" href="#/" data-nav="home">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-learn"/></svg>
      <span class="nav-label">Learn</span>
    </a>
    <a class="nav-item" href="#/letters" data-nav="letters">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-letters"/></svg>
      <span class="nav-label">Letters</span>
    </a>
    <a class="nav-item" href="#/settings" data-nav="settings">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-settings"/></svg>
      <span class="nav-label">Settings</span>
    </a>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
  <aside class="side" id="side" aria-label="Your day" hidden></aside>
</div>

<noscript><p class="noscript">This app needs JavaScript turned on.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
